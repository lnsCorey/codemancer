                '<label class="wr-sheet-check"><input type="checkbox" data-wr-remember /> Don’t ask again on this site</label>' +
                (isWeb
                    ? '<div class="wr-sheet-alt"><p>No app? ' + (action === 'join-ring' ? 'Copy the ring’s address:' : action === 'friend' ? 'Copy the site’s address:' : 'Copy the link:') + '</p>' +
                        '<div class="wr-sheet-copy"><input type="text" readonly value="' + esc(handoffUrl) + '" aria-label="Link" />' +
                        '<button type="button" data-wr="copy">Copy</button>' +
                        (typeof navigator.share === 'function' && action !== 'join-ring' ? '<button type="button" data-wr="share">Share…</button>' : '') +
                        '</div></div>'
                    : '') +
                '<a class="wr-sheet-about" href="' + safeUrl(ctx.projectUrl) + '" target="_blank" rel="noopener noreferrer">What’s Webring Studio?</a></div>';
        show();
        return true;
    };
    const isHandoffLink = (el) => el && /^webring:/i.test(el.getAttribute('href') || '') && !el.hasAttribute('data-wr-go');
    const maybeHandoff = (ev) => {
        if (ev.defaultPrevented || ev.button > 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)
            return false;
        const anchor = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!isHandoffLink(anchor) || !askFirst())
            return false;
        if (!showHandoff(anchor.getAttribute('href')))
            return false;
        ev.preventDefault();
        if (!opener)
            opener = anchor;
        return true;
    };
    root.addEventListener('click', maybeHandoff);
    const step = (delta) => {
        if (!current)
            return;
        const photos = current.album.photos;
        showPhoto(photos[(current.index + delta + photos.length) % photos.length].id);
    };
    root.addEventListener('click', (ev) => {
        if (ev.defaultPrevented || ev.button > 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey)
            return;
        const target = ev.target && ev.target.closest ? ev.target.closest('[data-lightbox], [data-open-post]') : null;
        if (!target)
            return;
        const opened = target.hasAttribute('data-open-post')
            ? showPost(target.getAttribute('data-open-post'))
            : showPhoto(target.getAttribute('data-photo-id'));
        if (opened) {
            ev.preventDefault();
            opener = target;
        }
    });
    dialog.addEventListener('click', (ev) => {
        if (ev.target === dialog)
            return dialog.close(); // backdrop
        if (maybeHandoff(ev))
            return; // Like / Share in the lightbox or post view
        const go = ev.target && ev.target.closest ? ev.target.closest('[data-wr-go]') : null;
        if (go) {
            const remember = dialog.querySelector('[data-wr-remember]');
            if (remember && remember.checked) {
                try {
                    localStorage.setItem(HANDOFF_KEY, 'direct');
                }
                catch (e) {
                    // private mode: the sheet will simply show again
                }
            }
            setTimeout(() => dialog.close(), 300); // let the browser start the hand-off first
            return;
        }
        const button = ev.target && ev.target.closest ? ev.target.closest('[data-wr]') : null;
        if (!button)
            return;
        const action = button.getAttribute('data-wr');
        if (action === 'close')
            dialog.close();
        else if (action === 'fullscreen')
            toggleFullscreen();
        else if (action === 'copy') {
            const field = dialog.querySelector('.wr-sheet-copy input');
            const done = () => {
                button.textContent = 'Copied ✓';
            };
            const fallback = () => {
                if (!field)
                    return;
                field.select();
                let copied = false;
                try {
                    copied = doc.execCommand('copy');
                }
                catch (e) {
                    copied = false;
                }
                if (copied)
                    done();
                else
                    button.textContent = 'Press Ctrl/⌘+C';
            };
            if (navigator.clipboard && navigator.clipboard.writeText)
                navigator.clipboard.writeText(handoffUrl).then(done, fallback);
            else
                fallback();
        }
        else if (action === 'share') {
            navigator.share({ url: handoffUrl }).catch(() => undefined);
        }
        else
            step(action === 'prev' ? -1 : 1);
    });
    dialog.addEventListener('keydown', (ev) => {
        if (!current)
            return;
        if (ev.key === 'ArrowLeft')
            step(-1);
        else if (ev.key === 'ArrowRight')
            step(1);
        else if (ev.key === 'f' && canFullscreen && !ev.metaKey && !ev.ctrlKey && !ev.altKey)
            toggleFullscreen();
    });
    dialog.addEventListener('dblclick', (ev) => {
        if (current && ev.target && ev.target.closest && ev.target.closest('.wr-stage img'))
            toggleFullscreen();
    });
    doc.addEventListener('fullscreenchange', () => {
        const button = dialog.querySelector('[data-wr="fullscreen"]');
        if (button)
            button.outerHTML = fullscreenButton(!!fullscreenLightbox());
    });
    dialog.addEventListener('touchstart', (ev) => {
        touchX = ev.touches && ev.touches[0] ? ev.touches[0].clientX : null;
    }, { passive: true });
    dialog.addEventListener('touchend', (ev) => {
        const endX = ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0].clientX : null;
        if (current && touchX !== null && endX !== null && Math.abs(endX - touchX) > 50)
            step(endX < touchX ? 1 : -1);
        touchX = null;
    });
    dialog.addEventListener('close', () => {
        if (fullscreenLightbox())
            doc.exitFullscreen().catch(() => undefined);
        current = null;
        dialog.innerHTML = '';
        setHash('');
        if (opener && opener.focus)
            opener.focus();
        opener = null;
    });
    // #post-<id> and #photo-<id> open on load and when the address changes
    const openFromHash = () => {
        const match = /^#(post|photo)-(.+)$/.exec(location.hash || '');
        if (!match)
            return;
        let id = match[2];
        try {
            id = decodeURIComponent(id);
        }
        catch (e) {
            return;
        }
        if (match[1] === 'post')
            showPost(id);
        else
            showPhoto(id);
    };
    window.addEventListener('hashchange', openFromHash);
    openFromHash();
    // Older posts loaded later (archives) can be opened in the post view too
    return {
        addItems: (items) => {
            (items || []).forEach((item) => {
                itemIndex[item.id] = item;
            });
        },
    };
};
      let enhancements = null;
      if (installPageEnhancements && !(profile.appearance && profile.appearance.interactions === 'off')) {
        try {
          enhancements = installPageEnhancements({ root, profile, albums: allAlbums, items: allItems, esc, safeUrl, buildDeepLink, renderItem, projectUrl: "https://github.com/lnsCorey/webring" });
        } catch (err) {
          console.warn('Interactive extras unavailable:', err);
        }
      }

      // Loading an archive month appends its posts in the page's layout
      async function loadArchiveItems(url) {
        const embedded = window.__WEBRING_ARCHIVES__;
        let doc = embedded && Object.prototype.hasOwnProperty.call(embedded, url) ? embedded[url] : null;
        if (!doc && window.location.protocol.startsWith('http')) {
          const res = await fetch('./' + String(url).replace(/^\/+/, ''), { credentials: 'omit', cache: 'no-cache' });
          if (res.ok) doc = await res.json();
        }
        if (!doc || !Array.isArray(doc.items)) throw new Error('Archive unavailable');
        return doc.items.filter(i => i && typeof i.id === 'string' && typeof i.canonicalUrl === 'string');
      }
      root.addEventListener('click', async function(ev) {
        const button = ev.target && ev.target.closest ? ev.target.closest('[data-archive-url]') : null;
        if (!button || button.disabled) return;
        const list = root.querySelector('[data-archive-list]');
        if (!list) return;
        button.disabled = true;
        try {
          const loaded = await loadArchiveItems(button.getAttribute('data-archive-url'));
          loaded.forEach(i => allItems.push(i));
          if (enhancements && enhancements.addItems) enhancements.addItems(loaded);
          const group = document.createElement('div');
          group.className = 'older-month-items mb-8';
          group.innerHTML = '<h3 class="text-lg font-bold mb-3">' + esc(button.getAttribute('data-archive-label')) + '</h3>' +
            '<div class="' + archiveView.wrapClass + '">' + loaded.map(archiveView.renderItem).join('') + '</div>';
          list.appendChild(group);
          button.classList.add('opacity-50');
        } catch (err) {
          button.disabled = false;
          button.setAttribute('title', 'Couldn\'t load this month. Try again.');
        }
      });

      // Initialize any rendered AdSense slots
      if (profile.adsAddon && profile.adsAddon.enabled && typeof window !== 'undefined') {
        const adNodes = root.querySelectorAll('ins.adsbygoogle');
        adNodes.forEach(() => {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (e) {}
        });
      }

      // Optional GA4 Webring interaction click tracking
      if (profile.analyticsAddon && profile.analyticsAddon.enabled && profile.analyticsAddon.trackRingInteractions !== false && typeof window.gtag === 'function') {
        root.addEventListener('click', function(ev) {
          const anchor = ev.target && ev.target.closest ? ev.target.closest('a[href^="webring://"]') : null;
          if (anchor) {
            window.gtag('event', 'webring_interact', {
              href: anchor.getAttribute('href') || ''
            });
          }
        });
      }
    })();
  </script>
</body>
